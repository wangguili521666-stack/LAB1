# 六个模块共用一个 MySQL 实例；每个模块一个独立数据库 + 独立账号，互不影响。
# 业务表由各模块自己的版本化迁移脚本创建，不要写进 db/init/（那里只做「库 + 账号」隔离）。
services:
  frontend:
    depends_on:
      d1:
        condition: service_healthy
    build:
      context: ./frontend
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      D1_API_TARGET: http://d1:3004
      # Other backends/gateway are not implemented; opt in to a real gateway via .env.
      API_TARGET: ${API_TARGET:-http://127.0.0.1:8080}
      VITE_USE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  d1:
    build:
      context: ./backend/D1
    init: true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3004"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: campus_d1
      DB_USER: d1_app
      DB_PASSWORD: ${D1_DB_PASSWORD:?请配置 D1_DB_PASSWORD}
      DB_TIMEZONE: "+08:00"
      JWT_SECRET: ${D1_JWT_SECRET:?请先运行 ./start.sh 生成登录签名密钥}
      JWT_EXPIRES_IN: "86400"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/d1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
