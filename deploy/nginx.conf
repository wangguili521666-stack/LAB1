server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /version.json { add_header Cache-Control 'no-store'; }
  location /api/d1/ { proxy_pass http://d1:3004; }
  location /api/d2/ { proxy_pass http://d2:3005; }
  location /api/d3/ { proxy_pass http://d3:3006; }
  location /api/m1/ { proxy_pass http://m1:3001; }
  location /api/m2/ { proxy_pass http://m2:3002; }
  location /api/m3/ { proxy_pass http://m3:3003; }
  location /api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
